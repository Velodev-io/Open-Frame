<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Frame - Your Photo Gallery</title>
    <link rel="stylesheet" href="/styles/main.css">
</head>

<body>
    <!-- Header -->
    <header class="app-header">
        <div class="header-left">
            <img src="/assets/logo.png" alt="Open Frame" class="header-logo">
            <h1 class="header-title">Open Frame</h1>
        </div>

        <div class="header-center">
            <div class="search-bar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8" />
                    <path d="m21 21-4.35-4.35" />
                </svg>
                <input type="text" placeholder="Search photos..." id="searchInput">
            </div>
        </div>

        <div class="header-right">
            <button class="icon-button" id="importBtn" title="Import Photos">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <polyline points="7 10 12 15 17 10" />
                    <line x1="12" y1="15" x2="12" y2="3" />
                </svg>
                <span>Import</span>
            </button>

            <button class="icon-button" id="settingsBtn" title="Settings">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3" />
                    <path d="M12 1v6m0 6v6M6 12H1m6 0h6" />
                </svg>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Stats Bar -->
        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-value" id="totalPhotos">0</div>
                <div class="stat-label">Photos</div>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item">
                <div class="stat-value" id="storageUsed">0 MB</div>
                <div class="stat-label">Storage</div>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item">
                <div class="stat-value" id="lastImport">Never</div>
                <div class="stat-label">Last Import</div>
            </div>
        </div>

        <!-- Empty State -->
        <div class="empty-state" id="emptyState">
            <div class="empty-icon">
                <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                    <circle cx="8.5" cy="8.5" r="1.5" />
                    <polyline points="21 15 16 10 5 21" />
                </svg>
            </div>
            <h2>No Photos Yet</h2>
            <p>Import photos from your folders to get started</p>
            <button class="primary-button" id="emptyImportBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <polyline points="7 10 12 15 17 10" />
                    <line x1="12" y1="15" x2="12" y2="3" />
                </svg>
                Import Photos
            </button>
        </div>

        <!-- Photo Grid -->
        <div class="photo-grid" id="photoGrid"></div>

        <!-- Loading State -->
        <div class="loading-state" id="loadingState" style="display: none;">
            <div class="spinner"></div>
            <p>Loading photos...</p>
        </div>
    </main>

    <!-- Photo Detail Modal -->
    <div class="modal" id="photoModal">
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <button class="modal-close" id="closeModal">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
            </button>

            <div class="modal-image-container">
                <img id="modalImage" src="" alt="">
            </div>

            <div class="modal-info">
                <h3 id="modalFilename">Photo.jpg</h3>
                <div class="modal-metadata">
                    <div class="metadata-item">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                        </svg>
                        <span id="modalDimensions">0 × 0</span>
                    </div>
                    <div class="metadata-item">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z" />
                            <polyline points="13 2 13 9 20 9" />
                        </svg>
                        <span id="modalSize">0 KB</span>
                    </div>
                    <div class="metadata-item">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                            <line x1="16" y1="2" x2="16" y2="6" />
                            <line x1="8" y1="2" x2="8" y2="6" />
                            <line x1="3" y1="10" x2="21" y2="10" />
                        </svg>
                        <span id="modalDate">Unknown</span>
                    </div>
                </div>

                <div class="modal-actions">
                    <button class="secondary-button" id="deletePhotoBtn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <polyline points="3 6 5 6 21 6" />
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                        </svg>
                        Delete
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Import Progress Modal -->
    <div class="modal" id="importModal">
        <div class="modal-backdrop"></div>
        <div class="import-modal-content">
            <h3>Importing Photos</h3>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <p class="progress-text" id="progressText">Preparing...</p>
            <div class="import-stats">
                <div class="import-stat">
                    <span class="import-stat-value" id="importedCount">0</span>
                    <span class="import-stat-label">Imported</span>
                </div>
                <div class="import-stat">
                    <span class="import-stat-value" id="skippedCount">0</span>
                    <span class="import-stat-label">Skipped</span>
                </div>
                <div class="import-stat">
                    <span class="import-stat-value" id="errorCount">0</span>
                    <span class="import-stat-label">Errors</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-backdrop"></div>
        <div class="settings-modal-content">
            <button class="modal-close" id="closeSettingsModal">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
            </button>
            <h3>Settings</h3>
            <form id="changePasswordForm" class="settings-form">
                <h4>Change Password</h4>
                <div class="settings-input-group">
                    <label for="currentPassword">Current Password</label>
                    <input type="password" id="currentPassword" placeholder="Enter current password" required>
                </div>
                <div class="settings-input-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" placeholder="At least 6 characters" minlength="6" required>
                </div>
                <div class="settings-input-group">
                    <label for="confirmNewPassword">Confirm New Password</label>
                    <input type="password" id="confirmNewPassword" placeholder="Re-enter new password" minlength="6" required>
                </div>
                <p id="settingsMessage" class="settings-message"></p>
                <button type="submit" class="primary-button settings-submit-btn">Update Password</button>
            </form>
            <div class="settings-divider"></div>
            <button type="button" class="secondary-button settings-logout-btn" id="logoutBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                    <polyline points="16 17 21 12 16 7" />
                    <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
                Lock &amp; Logout
            </button>
        </div>
    </div>

    <script src="/scripts/gallery.js"></script>
    <script src="/scripts/import.js"></script>
</body>

</html>
