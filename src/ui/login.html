<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Frame - Login</title>
  <link rel="stylesheet" href="styles/login.css">
</head>
<body>
  <div class="container">
    <div class="login-card">
      <div class="logo-section">
        <img src="../../assets/logo.png" alt="Open Frame Logo" class="logo">
        <h1 class="app-title">Open Frame</h1>
        <p class="app-subtitle">Your Personal Photo Gallery</p>
      </div>

      <!-- Setup Form (First Launch) -->
      <form id="setupForm" class="auth-form" style="display: none;">
        <h2>Welcome! Let's Get Started</h2>
        <p class="form-description">Create a password to protect your photos</p>
        
        <div class="input-group">
          <label for="setupPassword">Choose Password</label>
          <input 
            type="password" 
            id="setupPassword" 
            placeholder="Enter a strong password"
            required
            minlength="6"
          >
        </div>

        <div class="input-group">
          <label for="setupPasswordConfirm">Confirm Password</label>
          <input 
            type="password" 
            id="setupPasswordConfirm" 
            placeholder="Re-enter your password"
            required
            minlength="6"
          >
        </div>

        <button type="submit" class="auth-button">
          <span>Create Account</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </button>

        <p class="error-message" id="setupError"></p>
      </form>

      <!-- Login Form -->
      <form id="loginForm" class="auth-form" style="display: none;">
        <h2>Welcome Back</h2>
        <p class="form-description">Enter your password to continue</p>
        
        <div class="input-group">
          <label for="loginPassword">Password</label>
          <input 
            type="password" 
            id="loginPassword" 
            placeholder="Enter your password"
            required
          >
        </div>

        <button type="submit" class="auth-button">
          <span>Unlock Gallery</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </button>

        <p class="error-message" id="loginError"></p>
      </form>
    </div>

    <!-- Background decoration -->
    <div class="bg-decoration"></div>
    <div class="bg-decoration-2"></div>
  </div>

  <script src="scripts/login.js"></script>
</body>
</html>
